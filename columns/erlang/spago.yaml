# The BEAM lowering of the engine: the purerl package set and purs-backend-erl
# (from this repo's node_modules: `npm install`). The engine's js-bigints
# resolves to the purerl port in ../../vendor/js-bigints here.
package:
  name: littorina-column-erlang
  dependencies:
    - effect
    - prelude
    - littorina
workspace:
  packageSet:
    url: https://raw.githubusercontent.com/purerl/package-sets/erl-0.15.3-20220629/packages.json
  extraPackages:
    littorina:
      path: ../../core
    js-bigints:
      path: ../../vendor/js-bigints
  backend:
    cmd: "../../node_modules/.bin/purs-backend-erl"
